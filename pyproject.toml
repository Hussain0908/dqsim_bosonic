[project]
name = "dqsim"
version = "0.1.0"
description = "Native NumPy statevector simulator for distributed quantum circuits"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Elie Ben-Shlomo", email = "categoricalsolutions@gmail.com" },
]
dependencies = [
    "bosonic-model",
    "bosonic-converters",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dqsim"]

[tool.hatch.metadata]
allow-direct-references = true
