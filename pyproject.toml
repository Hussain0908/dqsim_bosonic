[project]
name = "dqsim"
version = "0.1.0"
description = "Native Rust statevector simulator for distributed quantum circuits"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Elie Ben-Shlomo", email = "categoricalsolutions@gmail.com" },
]
dependencies = [
    "bosonic-model>=0.1.1,<0.2.0",
    "bosonic-converters>=0.1.0,<0.2.0",
    "numpy>=1.26",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "qasmpi>=0.1.1",
    "bosonic-model>=0.1.1,<0.2.0",
    "bosonic-converters>=0.1.0,<0.2.0",
    "bosonic-sdk>=0.1.0,<0.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
bosonic-model = { path = "../dqcomp/packages/bosonic-model", editable = true }
bosonic-converters = { path = "../dqcomp/packages/bosonic-converters", editable = true }
bosonic-sdk = { path = "../dqcomp/packages/bosonic-sdk", editable = true }
qasmpi = { path = "../qasmpi", editable = true }

[tool.maturin]
module-name = "dqsim._core"
